<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — PGDA Notes by Courts</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<!-- iOS ignores SVG icons; "Add to Home Screen" needs a PNG (180x180, no rounded corners — iOS adds them) -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="PGDA Admin" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles.css">
<link rel="stylesheet" href="/src/admin/admin.css">
</head>
<body>

<!-- ══════════════ HEADER ══════════════ -->
<header class="site-header">
  <div class="wrap header-inner">
    <a href="/" class="logo" aria-label="PGDA Notes by Courts, home">
      <span class="mark">PGDA</span>
      <span class="stack">
        <span class="word">ADMIN</span>
        <span class="by">PGDA NOTES</span>
      </span>
    </a>
    <div class="header-actions" id="logoutWrap" hidden>
      <span class="live-visitors" id="liveVisitors" title="Browser tabs with the site open right now">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="liveVisitorsCount">–</span> online
      </span>
      <button class="btn ghost" id="logoutBtn">Log out</button>
    </div>
  </div>
</header>

<main class="admin-main">

  <!-- ══════════════ LOGIN ══════════════ -->
  <section id="loginView" class="admin-card login-card wrap">
    <div class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
        <path d="M32 21c-3.6-3.4-8.4-5-14-5v25c5.6 0 10.4 1.6 14 5 3.6-3.4 8.4-5 14-5V16c-5.6 0-10.4 1.6-14 5z" stroke-width="3"/>
        <path d="M32 21v25" stroke-width="3"/>
      </svg>
    </div>
    <h1>Admin</h1>
    <p class="lede">Enter the admin password to manage orders, notes and discount codes.</p>
    <form id="loginForm">
      <label class="field"><span>Password</span>
        <input type="password" id="passwordInput" autocomplete="current-password" required>
      </label>
      <label class="remember-field">
        <input type="checkbox" id="rememberInput">
        <span>Keep me signed in on this device</span>
      </label>
      <div id="loginError"></div>
      <button class="btn" id="loginBtn" type="submit">Log in</button>
    </form>
  </section>

  <!-- ══════════════ DASHBOARD ══════════════ -->
  <!-- .admin-shell right on this section (not a wrapper div one level in) —
       the sidebar needs to run flush against the actual left edge of the
       page, which means it can't sit inside .wrap's centered/padded column
       the way everything else on this page does. See admin.css. -->
  <section id="dashboardView" class="admin-shell" hidden>
    <nav class="admin-sidebar" aria-label="Admin sections">
      <button class="side-nav-item is-on" data-tab="dashboard">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="side-nav-item" data-tab="orders">
        <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.55L20.5 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg>
        <span>Orders</span>
      </button>
      <button class="side-nav-item" data-tab="notes">
        <svg viewBox="0 0 24 24"><path d="M7 3.5h6.5L18 8v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/><path d="M13.5 3.5V8H18"/></svg>
        <span>Notes</span>
      </button>
      <button class="side-nav-item" data-tab="discounts">
        <svg viewBox="0 0 24 24"><path d="M12.3 3H5.5a2 2 0 0 0-2 2v6.8c0 .53.21 1.04.59 1.41l8.7 8.7a2 2 0 0 0 2.82 0l6.2-6.2a2 2 0 0 0 0-2.82l-8.7-8.7A2 2 0 0 0 12.3 3z"/><circle cx="8.3" cy="8.3" r="1.3"/></svg>
        <span>Discounts</span>
      </button>
    </nav>

    <div class="admin-content">
      <div id="dashOverview">
        <div class="dash-header">
          <div>
            <h2 id="dashGreeting">Good morning!</h2>
            <p class="dash-sub">Here's what's happening with your store.</p>
          </div>
          <div class="dash-header-actions">
            <button type="button" id="dashRefreshBtn" class="dash-refresh-btn" title="Refresh dashboard data" aria-label="Refresh dashboard data">
              <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            </button>
            <div class="dash-range-select">
              <select id="dashRange" aria-label="Date range">
                <option value="today">Today</option>
                <option value="7">Last 7 days</option>
                <option value="30" selected>Last 30 days</option>
                <option value="90">Last 90 days</option>
                <option value="all">All time</option>
              </select>
              <svg viewBox="0 0 24 24" class="dash-range-chevron"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
        </div>

        <div class="dash-stats" id="dashStats"></div>

        <div class="dash-grid-2">
          <div class="admin-card dash-card">
            <div class="dash-card-head">
              <div>
                <h3>Revenue</h3>
                <p class="dash-card-sub">Total revenue from note sales</p>
              </div>
              <div class="dash-figure" id="dashRevenueFigure"></div>
            </div>
            <div id="dashChartInner" class="dash-chart-host"></div>
          </div>

          <div class="admin-card dash-card">
            <h3>Sales by module</h3>
            <div id="dashCategoryChart"></div>
          </div>
        </div>

        <div class="dash-grid-2">
          <div class="admin-card dash-card">
            <div class="dash-card-head">
              <h3>Recent orders</h3>
              <button type="button" class="dash-view-all" data-tab="orders">View all →</button>
            </div>
            <div id="dashRecentOrders"></div>
          </div>

          <div class="admin-card dash-card">
            <div class="dash-card-head">
              <h3>Top selling notes</h3>
              <button type="button" class="dash-view-all" data-tab="notes">View all →</button>
            </div>
            <div id="dashTopNotes"></div>
          </div>
        </div>
      </div>

      <div id="ordersView" hidden>
        <div id="ordersTable"></div>
      </div>

      <div id="notesView" hidden>
        <div class="admin-toolbar">
          <button class="btn" id="addNoteBtn">Add note</button>
        </div>
        <div id="productsTable"></div>
      </div>

      <div id="discountsView" hidden>
        <form class="discount-form" id="discountForm">
          <label class="field"><span>Code</span>
            <input id="df_code" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_\-]{3,32}"
                   title="3-32 letters, numbers, - or _" autocomplete="off" spellcheck="false" placeholder="EXAMS20">
          </label>
          <label class="field"><span>% off</span>
            <input type="number" id="df_percent" required min="1" max="99" step="1" placeholder="20">
          </label>
          <button class="btn" id="addDiscountBtn" type="submit">Add code</button>
          <div id="discountFormError"></div>
        </form>
        <div id="discountsTable"></div>
      </div>
    </div>
  </section>

</main>

<!-- ══════════════ PRODUCT EDITOR MODAL ══════════════ -->
<div id="productModal" class="admin-modal" hidden>
  <div class="admin-modal-scrim" id="closeModal"></div>
  <form class="admin-modal-panel" id="productForm">
    <h2 id="productFormTitle">Add note</h2>
    <input type="hidden" id="pf_id">
    <div class="admin-form-grid">
      <label class="field admin-span-2"><span>Module</span>
        <select id="pf_module" required></select>
      </label>
      <label class="field admin-span-2"><span>Title</span><input id="pf_title" required></label>
      <label class="field admin-span-2"><span>Description</span><textarea id="pf_description"></textarea></label>
      <label class="field"><span>Price (rands)</span><input type="number" id="pf_price" min="0" step="0.01" required></label>
      <label class="field"><span>Sort order</span><input type="number" id="pf_sort" step="1"></label>
      <label class="field checkbox-field admin-span-2">
        <input type="checkbox" id="pf_active" checked><span>Active (visible in the shop)</span>
      </label>
      <label class="field admin-span-2">
        <span>PDF</span>
        <input type="file" id="pf_file" accept="application/pdf">
        <small id="pf_file_hint" class="field-hint">Required.</small>
        <button type="button" id="pf_view_pdf" class="field-link" hidden>View current PDF ↗</button>
      </label>
    </div>
    <div id="productFormError"></div>
    <div class="admin-modal-actions">
      <button type="button" class="btn ghost" id="cancelForm">Cancel</button>
      <button type="submit" class="btn" id="saveProduct">Save</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/src/admin/main.js"></script>
</body>
</html>
