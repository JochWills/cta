# Render Blueprint — https://render.com/docs/blueprint-spec
#
# With this file in the repo root you can deploy via
# Render Dashboard → New → Blueprint, instead of filling in the
# build settings by hand. See docs/deploy-render.md.

services:
  - type: web
    name: cta-notes
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true

    envVars:
      # sync: false means "prompt me for this in the dashboard" — the value is
      # never committed. Set both from Supabase → Settings → API.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Pin Node so a future Render default doesn't change the build under you.
      - key: NODE_VERSION
        value: 20.11.1

    headers:
      # Vite fingerprints filenames in /assets, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html and admin.html must NOT be cached anywhere, or visitors
      # (and Courts, editing notes right after a deploy) keep loading an old
      # bundle. no-store, not no-cache: no-cache still permits a shared/CDN
      # cache to serve a stored copy after revalidation, which is exactly
      # what happened here — a real deploy sat behind a stale cached
      # admin.html for several minutes even past its own max-age. no-store
      # forbids storing the response anywhere, full stop.
      - path: /index.html
        name: Cache-Control
        value: no-store
      - path: /admin.html
        name: Cache-Control
        value: no-store
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    # Serve the legal pages without ".html" in the address bar — a rewrite,
    # not a redirect, so the URL the visitor sees stays /terms, but Render
    # serves the built terms.html for it. Deliberately not a catch-all
    # (/* -> /index.html): this is a single page with anchor navigation, not
    # a client-side router, so a catch-all would only hide genuine 404s.
    # /terms.html and /privacy.html still work directly too — nothing here
    # stops them, this just adds a second way in.
    routes:
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
